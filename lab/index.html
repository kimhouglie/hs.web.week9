<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파랑색</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #01579b;
            overflow: hidden;
        }

        .ocean-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            animation: fadeUp 0.8s ease-out forwards;
        }

        .tab {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: filter 0.3s ease;
        }

        .tab:hover {
            filter: brightness(1.2);
            z-index: 10;
        }

        .tab h2, .tab h3, .tab p {
            pointer-events: none;
            transition: transform 0.3s ease;
        }

        .tab:hover h2, .tab:hover h3 {
            transform: scale(1.05);
        }

        .main-ocean {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background-color: #01579b;
            transition: all 0.9s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .side-ocean {
            position: absolute;
            display: flex;
            flex-direction: column;
            transition: all 0.9s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .col-1 {
            top: 0;
            left: 50%;
            width: 25%;
            height: 100%;
        }

        .col-2 {
            top: 0;
            left: 75%;
            width: 25%;
            height: 100%;
        }

        .sub-sea {
            flex: 1;
            width: 100%;
        }

        .main-ocean h2 { font-size: clamp(24px, 3.5vw + 2vh, 80px); margin-bottom: 1vh; letter-spacing: 2px; }
        .main-ocean p { font-size: clamp(12px, 1.5vw + 1vh, 40px); opacity: 0.9; }
        .sub-sea h3 { font-size: clamp(14px, 2vw + 1vh, 50px); letter-spacing: 1px; }

        .sea-1 { background-color: #0277bd; }
        .sea-2 { background-color: #0288d1; }
        .sea-3 { background-color: #039be5; }
        .sea-4 { background-color: #03a9f4; }
        .sea-5 { background-color: #29b6f6; }
        .sea-6 { background-color: #4fc3f7; }
        .sea-7 { background-color: #81d4fa; color: #01579b;}

        @media (max-width: 1100px) {
            .main-ocean { width: 45%; }
            .col-1 { top: 0; left: 45%; width: 55%; height: 45%; }
            .col-2 { top: 45%; left: 45%; width: 55%; height: 55%; }
        }

        @media (max-width: 850px) {
            .main-ocean { width: 100%; height: 40%; }
            .col-1 { top: 40%; left: 0; width: 50%; height: 60%; }
            .col-2 { top: 40%; left: 50%; width: 50%; height: 60%; }
        }

        @media (max-width: 550px) {
            .main-ocean { height: 35%; }
            .col-1 { top: 35%; left: 0; width: 100%; height: 30%; }
            .col-2 { top: 65%; left: 0; width: 100%; height: 35%; }
            
            .main-ocean h2 { font-size: clamp(24px, 8vw, 40px); }
            .main-ocean p { font-size: clamp(12px, 4vw, 20px); }
            .sub-sea h3 { font-size: clamp(16px, 5vw, 26px); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: rippleEffect 0.6s linear;
            pointer-events: none;
        }
        @keyframes rippleEffect {
            to { transform: scale(4); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="ocean-container">
        <div class="tab main-ocean">
            <h2>다크 블루</h2>
            <p>#01579B</p>
        </div>
        
        <div class="side-ocean col-1">
            <div class="tab sub-sea sea-1"><h3>코발트 블루</h3></div>
            <div class="tab sub-sea sea-2"><h3>사파이어 블루</h3></div>
            <div class="tab sub-sea sea-3"><h3>셀룰리안 블루</h3></div>
        </div>

        <div class="side-ocean col-2">
            <div class="tab sub-sea sea-4"><h3>스카이 블루</h3></div>
            <div class="tab sub-sea sea-5"><h3>라이트 블루</h3></div>
            <div class="tab sub-sea sea-6"><h3>아쿠아 블루</h3></div>
            <div class="tab sub-sea sea-7"><h3>파스텔 블루</h3></div>
        </div>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab');
        
        tabs.forEach(tab => {
            tab.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                
                ripple.style.width = ripple.style.height = `${size}px`;
                ripple.style.left = `${e.clientX - rect.left - size/2}px`;
                ripple.style.top = `${e.clientY - rect.top - size/2}px`;
                
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>
</body>
</html>
